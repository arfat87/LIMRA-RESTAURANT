<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — LIMRA Management System</title>
  <meta name="description" content="Secure staff login for LIMRA Restaurant Management System. Admin, Manager, Kitchen, and Cashier access.">
  <link rel="stylesheet" href="../src/style.css">
  <style>
    /* ── Login page specific ── */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--black);
      overflow: hidden;
      position: relative;
    }

    /* Background ambient orbs */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      pointer-events: none;
    }
    .bg-orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
      top: -150px; left: -150px;
      animation: orbFloat1 12s ease-in-out infinite;
    }
    .bg-orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #c8860a 0%, transparent 70%);
      bottom: -100px; right: -100px;
      animation: orbFloat2 10s ease-in-out infinite;
    }
    .bg-orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(255,200,50,0.5) 0%, transparent 70%);
      top: 50%; left: 60%;
      animation: orbFloat3 14s ease-in-out infinite;
    }
    @keyframes orbFloat1 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(40px,30px);} }
    @keyframes orbFloat2 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(-30px,-40px);} }
    @keyframes orbFloat3 { 0%,100%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-50%,-50%) scale(1.3);} }

    /* Subtle grid texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(200,134,10,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(200,134,10,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* ── Login Card ── */
    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 1.5rem;
      animation: fadeUp 0.6s ease both;
    }

    .login-card {
      background: rgba(17,17,17,0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(200,134,10,0.2);
      border-radius: 1.25rem;
      padding: 2.5rem;
      box-shadow: 0 32px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.03) inset, var(--shadow-gold);
    }

    /* ── Logo area ── */
    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo-icon {
      width: 4rem;
      height: 4rem;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      border-radius: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin: 0 auto 1rem;
      box-shadow: 0 8px 24px rgba(200,134,10,0.35);
    }
    .login-logo-name {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: 0.05em;
    }
    .login-logo-name span {
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-logo-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-top: 0.25rem;
    }
    .login-divider {
      width: 3rem;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 1rem auto 0;
      border-radius: 99px;
    }

    /* ── Form ── */
    .login-form { display: flex; flex-direction: column; gap: 1.25rem; }

    .login-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.4rem;
    }

    .input-wrapper {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      pointer-events: none;
      opacity: 0.5;
    }
    .login-input {
      width: 100%;
      padding: 0.75rem 2.75rem 0.75rem 2.5rem;
      background: rgba(34,34,34,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 0.75rem;
      color: var(--text-primary);
      font-size: 0.9rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      outline: none;
    }
    .login-input:focus {
      border-color: var(--gold);
      background: rgba(40,40,40,0.95);
      box-shadow: 0 0 0 3px rgba(200,134,10,0.15), 0 0 20px rgba(200,134,10,0.08);
    }
    .login-input::placeholder { color: rgba(122,112,96,0.6); }
    .login-input:-webkit-autofill,
    .login-input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px #222 inset;
      -webkit-text-fill-color: var(--text-primary);
    }

    .password-toggle {
      position: absolute;
      right: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.25rem;
      transition: color 0.15s;
    }
    .password-toggle:hover { color: var(--gold); }

    /* ── Error ── */
    .login-error {
      display: none;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 0.75rem;
      color: #f87171;
      font-size: 0.825rem;
      line-height: 1.5;
    }
    .login-error-icon { flex-shrink: 0; margin-top: 0.05rem; }

    /* ── Submit Button ── */
    .login-btn {
      width: 100%;
      padding: 0.875rem 1.5rem;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
      border: none;
      border-radius: 0.75rem;
      color: #000;
      font-weight: 700;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(200,134,10,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      letter-spacing: 0.03em;
      position: relative;
      overflow: hidden;
    }
    .login-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .login-btn:hover::before { opacity: 1; }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(200,134,10,0.5); }
    .login-btn:active { transform: scale(0.98); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-spinner {
      width: 1rem; height: 1rem;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    /* ── Footer ── */
    .login-footer {
      margin-top: 1.75rem;
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
      line-height: 1.8;
    }
    .login-footer strong { color: var(--text-secondary); font-weight: 500; }
  </style>
</head>
<body>
  <!-- Ambient background -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <div class="login-wrapper">
    <div class="login-card">
      <!-- Logo -->
      <div class="login-logo">
        <div class="login-logo-icon">🍽</div>
        <div class="login-logo-name"><span>LIMRA</span></div>
        <div class="login-logo-subtitle">Management System</div>
        <div class="login-divider"></div>
      </div>

      <!-- Form -->
      <form id="login-form" class="login-form" autocomplete="on" novalidate>
        <!-- Error alert -->
        <div id="login-error" class="login-error" role="alert">
          <span class="login-error-icon">⚠️</span>
          <span id="login-error-text"></span>
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="login-label">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input
              type="email"
              id="email"
              name="email"
              class="login-input"
              placeholder="staff@limra.in"
              autocomplete="username"
              required
            >
          </div>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="login-label">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              class="login-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <button type="button" id="toggle-password" class="password-toggle" title="Toggle password visibility">👁</button>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" id="login-btn" class="login-btn">
          <span id="btn-spinner" class="btn-spinner hidden"></span>
          <span id="btn-text">Sign In</span>
          <span id="btn-icon">→</span>
        </button>
      </form>

      <!-- Footer -->
      <div class="login-footer">
        <strong>LIMRA Restaurant</strong><br>
        Staff access only &mdash; Authorized personnel only<br>
        <span>Powered by InsForge &bull; Secured portal</span>
      </div>
    </div>
  </div>

  <script type="module" src="./admin-auth.js"></script>
</body>
</html>
