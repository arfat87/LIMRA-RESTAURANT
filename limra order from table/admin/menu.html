<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Management — LIMRA RMS</title>
  <meta name="description" content="Manage menu categories and food items for LIMRA Restaurant.">
  <link rel="stylesheet" href="../src/style.css">
  <style>
    /* ── Menu Mgmt Specific ── */
    .menu-mgmt-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin-top: 1rem;
    }
    @media (min-width: 992px) {
      .menu-mgmt-container {
        grid-template-columns: 320px 1fr;
      }
    }

    /* Left Panel: Categories */
    .categories-panel {
      background: var(--dark-3);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 1.25rem;
      height: fit-content;
    }
    .categories-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .category-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.85rem;
      background: var(--dark-2);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all 0.15s;
    }
    .category-item:hover,
    .category-item.active {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--gold-bg);
    }
    .category-actions {
      display: flex;
      gap: 0.35rem;
      opacity: 0.5;
      transition: opacity 0.15s;
    }
    .category-item:hover .category-actions { opacity: 1; }
    .cat-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0.15rem;
      font-size: 0.8rem;
    }
    .cat-btn:hover { color: var(--text-primary); }

    /* Right Panel: Items Grid */
    .items-panel {
      background: var(--dark-3);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 1.5rem;
    }
    .items-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
    }

    /* Item Card */
    .item-card {
      background: var(--dark-2);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .item-card-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      background: var(--dark-3);
    }
    .item-card-placeholder {
      width: 100%;
      height: 140px;
      background: var(--dark-3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    .item-card-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
    }
    .item-card-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .item-card-price {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--gold);
    }
    .item-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }

    /* Switch toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--dark-5);
      transition: .4s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--status-available); }
    input:checked + .slider:before { transform: translateX(18px); }

    /* Modal Form overrides */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal.visible { display: flex; }
    .modal-content {
      background: var(--dark-2);
      border: 1px solid var(--border-light);
      border-radius: var(--r-xl);
      width: 100%;
      max-width: 520px;
      overflow: hidden;
      animation: fadeUp 0.3s ease both;
    }
    .modal-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.01);
    }
    .modal-body {
      padding: 1.5rem;
      max-height: 70vh;
      overflow-y: auto;
    }
    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .form-group-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .img-preview {
      width: 100%;
      height: 120px;
      border-radius: var(--r-md);
      background: var(--dark-3);
      border: 1px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-top: 0.5rem;
      position: relative;
    }
    .img-preview img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="admin-layout" id="admin-app">

    <!-- ═══════════════════ SIDEBAR ═══════════════════ -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">🍽</div>
        <div>
          <div class="sidebar-logo-text">LIMRA</div>
          <div class="sidebar-logo-sub">Management System</div>
        </div>
      </div>

      <nav class="sidebar-nav" role="navigation" aria-label="Admin navigation">
        <div class="sidebar-nav-section">Overview</div>

        <a href="./dashboard.html" class="sidebar-nav-link" data-page="dashboard.html">
          <svg class="sidebar-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
          </svg>
          Dashboard
        </a>

        <a href="./orders.html" class="sidebar-nav-link" data-page="orders.html">

            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
            <rect x="9" y="3" width="6" height="4" rx="1"/>
            <path d="M9 12h6M9 16h4"/>

        <a href="./tables.html" class="sidebar-nav-link" data-page="tables.html">
          <svg class="sidebar-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3h18v4H3zM5 7v14M19 7v14M3 12h18"/>
          </svg>
          Tables & Floor Map
        </a>

        <a href="./kitchen.html" class="sidebar-nav-link" data-page="kitchen.html">
          <svg class="sidebar-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2v20M18 2v20M6 12h12M9 6c0-1.5 6-1.5 6 0M9 18c0 1.5 6 1.5 6 0"/>
          </svg>
          Kitchen Display
        </a>

        <a href="./billing.html" class="sidebar-nav-link" data-page="billing.html">
          <svg class="sidebar-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
          Billing & Payments
        </a>

        <div class="sidebar-nav-section" style="margin-top:0.5rem">Management</div>

        <a href="./menu.html" class="sidebar-nav-link" data-page="menu.html">
          <svg class="sidebar-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a10 10 0 110 20 10 10 0 010-20zM12 8v4l3 3"/>
          </svg>
          Menu Management
        </a>

        <a href="./reports.html" class="sidebar-nav-link" data-page="reports.html">
          <svg class="sidebar-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 20V10M12 20V4M6 20v-6"/>
          </svg>
          Reports & Analytics
        </a>

        <a href="./settings.html" class="sidebar-nav-link" data-page="settings.html">
          <svg class="sidebar-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
          Settings
        </a>
      </nav>

      <div style="padding:1rem;border-top:1px solid var(--border)">
        <button id="logout-btn" class="btn btn-outline btn-full">Sign Out</button>
        <div id="sidebar-role-chip" style="margin-top:0.5rem;text-align:center;font-size:0.65rem;color:var(--text-muted)"></div>
      </div>
    </aside>

    <div id="sidebar-overlay"></div>

    <!-- ═══════════════════ MAIN ═══════════════════ -->
    <main class="admin-main">
      <header class="admin-topbar" role="banner">
        <div class="topbar-left">
          <button class="hamburger-btn" id="hamburger-btn" aria-label="Toggle sidebar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12h18M3 6h18M3 18h18"/>
            </svg>
          </button>
          <div>
            <div class="page-title">Menu Management</div>
            <div class="live-dot" style="margin-top:0.15rem">Categories & Items</div>
          </div>
        </div>
      </header>

      <div class="admin-content">
        <div class="menu-mgmt-container">
          
          <!-- LEFT: Categories -->
          <div class="categories-panel">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <h3 style="font-family:var(--font-display);font-size:1.1rem;font-weight:700;">Categories</h3>
              <button class="btn btn-sm" id="btn-add-category" style="padding:0.35rem 0.6rem;">+ Add</button>
            </div>
            <div class="categories-list" id="categories-list">
              <!-- populated by JS -->
            </div>
          </div>

          <!-- RIGHT: Items List -->
          <div class="items-panel">
            <div class="items-header">
              <h3 style="font-family:var(--font-display);font-size:1.2rem;font-weight:700;" id="active-category-title">All Items</h3>
              <button class="btn" id="btn-add-item">+ Add Menu Item</button>
            </div>
            
            <div class="items-grid" id="items-grid">
              <!-- populated by JS -->
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <!-- ═══════════════════ MODAL: CATEGORY FORM ═══════════════════ -->
  <div class="modal" id="modal-category">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="category-modal-title" style="font-family:var(--font-display);font-weight:700;">Add Category</h3>
        <button class="cat-btn" id="category-modal-close" style="font-size:1.25rem;">&times;</button>
      </div>
      <form id="form-category">
        <input type="hidden" id="cat-id" />
        <div class="modal-body">
          <div class="form-group">
            <label for="cat-name">Category Name</label>
            <input type="text" id="cat-name" required placeholder="e.g. Biryani, Gravies" />
          </div>
          <div class="form-group">
            <label for="cat-sort">Sort Order</label>
            <input type="number" id="cat-sort" value="0" required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="btn-cancel-cat">Cancel</button>
          <button type="submit" class="btn" style="background:var(--gold);color:#000;border:none;">Save Category</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══════════════════ MODAL: ITEM FORM ═══════════════════ -->
  <div class="modal" id="modal-item">
    <div class="modal-content" style="max-width:560px;">
      <div class="modal-header">
        <h3 id="item-modal-title" style="font-family:var(--font-display);font-weight:700;">Add Menu Item</h3>
        <button class="cat-btn" id="item-modal-close" style="font-size:1.25rem;">&times;</button>
      </div>
      <form id="form-item">
        <input type="hidden" id="item-id" />
        <div class="modal-body">
          <div class="form-group-row">
            <div class="form-group">
              <label for="item-category">Category</label>
              <select id="item-category" required>
                <!-- populated dynamically -->
              </select>
            </div>
            <div class="form-group">
              <label for="item-name">Item Name</label>
              <input type="text" id="item-name" required placeholder="e.g. Chicken Biryani" />
            </div>
          </div>

          <div class="form-group">
            <label for="item-desc">Description</label>
            <textarea id="item-desc" placeholder="Brief description of the dish..." style="height:60px;resize:none;"></textarea>
          </div>

          <div class="form-group-row">
            <div class="form-group">
              <label for="item-price">Price (₹)</label>
              <input type="number" step="0.01" id="item-price" required placeholder="180.00" />
            </div>
            <div class="form-group">
              <label for="item-prep">Prep Time (mins)</label>
              <input type="number" id="item-prep" value="15" required />
            </div>
          </div>

          <div class="form-group-row" style="align-items:center;padding:0.5rem 0;">
            <div class="form-group" style="flex-direction:row;gap:0.5rem;align-items:center;">
              <input type="checkbox" id="item-featured" style="width:auto;margin:0;" />
              <label for="item-featured" style="margin:0;cursor:pointer;">⭐ Mark Featured (Chef Choice)</label>
            </div>
          </div>

          <div class="form-group">
            <label for="item-image-file">Upload Image</label>
            <input type="file" id="item-image-file" accept="image/*" />
            <div class="img-preview" id="item-img-preview">
              <span style="color:var(--text-muted);font-size:0.75rem;">No Image Uploaded</span>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="btn-cancel-item">Cancel</button>
          <button type="submit" class="btn" style="background:var(--gold);color:#000;border:none;" id="btn-submit-item">Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>
  <script type="module" src="./menu.js"></script>
</body>
</html>
