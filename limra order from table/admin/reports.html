<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports — LIMRA Admin</title>
  <link rel="stylesheet" href="../src/style.css"/>
</head>
<body class="admin-layout">

  <!-- Sidebar (loaded by admin-layout.js) -->
  <aside class="admin-sidebar" id="admin-sidebar"></aside>

  <!-- Main -->
  <div class="admin-main">
    <div class="admin-topbar">
      <button id="sidebar-toggle" class="btn btn-outline btn-sm" style="display:none;">☰</button>
      <h1 class="section-title" style="font-size:1.25rem; margin-bottom:0;">📊 Reports</h1>
      <div style="display:flex; align-items:center; gap:0.75rem;">
        <input type="date" id="report-date" class="form-input" style="width:auto; padding:0.4rem 0.75rem; font-size:0.8rem;"/>
        <button id="load-report-btn" class="btn btn-gold btn-sm">Load</button>
      </div>
    </div>

    <div class="admin-content">

      <!-- Revenue Stats -->
      <div class="stats-grid" style="margin-bottom:1.5rem;">
        <div class="stat-card gold">
          <div class="stat-icon">💰</div>
          <div class="stat-value" id="rep-revenue">₹0</div>
          <div class="stat-label">Day Revenue</div>
        </div>
        <div class="stat-card green">
          <div class="stat-icon">📦</div>
          <div class="stat-value" id="rep-orders">0</div>
          <div class="stat-label">Total Orders</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-icon">🏠</div>
          <div class="stat-value" id="rep-indoor">₹0</div>
          <div class="stat-label">Indoor Revenue</div>
        </div>
        <div class="stat-card" style="border-color:var(--gold-border);">
          <div class="stat-icon">🌿</div>
          <div class="stat-value" id="rep-outdoor">₹0</div>
          <div class="stat-label">Outdoor Revenue</div>
        </div>
      </div>

      <!-- Revenue Chart -->
      <div class="card" style="margin-bottom:1.5rem;">
        <h2 style="font-family:var(--font-display); font-size:1.1rem; font-weight:700; color:var(--text-primary); margin-bottom:1rem;">💹 Last 7 Days Revenue</h2>
        <div id="revenue-chart" style="height:200px; display:flex; align-items:flex-end; gap:0.5rem; padding:0 0.5rem;">
          <!-- bars rendered by JS -->
        </div>
        <div id="revenue-chart-labels" style="display:flex; gap:0.5rem; padding:0.5rem 0.5rem 0; font-size:0.65rem; color:var(--text-muted);"></div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; margin-bottom:1.5rem;">
        <!-- Top Selling Items -->
        <div class="card">
          <h2 style="font-family:var(--font-display); font-size:1.1rem; font-weight:700; color:var(--text-primary); margin-bottom:1rem;">🏆 Top Selling Items</h2>
          <div id="top-items-list" style="display:flex; flex-direction:column; gap:0.6rem;">
            <div style="color:var(--text-muted); font-size:0.85rem; text-align:center; padding:1rem;">Loading...</div>
          </div>
        </div>

        <!-- Table Performance -->
        <div class="card">
          <h2 style="font-family:var(--font-display); font-size:1.1rem; font-weight:700; color:var(--text-primary); margin-bottom:1rem;">🪑 Table Performance</h2>
          <div id="table-perf-list" style="display:flex; flex-direction:column; gap:0.5rem; max-height:300px; overflow-y:auto;">
            <div style="color:var(--text-muted); font-size:0.85rem; text-align:center; padding:1rem;">Loading...</div>
          </div>
        </div>
      </div>

      <!-- Customer Ratings -->
      <div class="card">
        <h2 style="font-family:var(--font-display); font-size:1.1rem; font-weight:700; color:var(--text-primary); margin-bottom:1rem;">⭐ Customer Ratings</h2>
        <div id="ratings-list" style="display:flex; flex-direction:column; gap:0.75rem; max-height:300px; overflow-y:auto;">
          <div style="color:var(--text-muted); font-size:0.85rem; text-align:center; padding:1rem;">No ratings yet</div>
        </div>
      </div>

    </div>
  </div>

  <div id="toast-container"></div>
  <script type="module" src="./reports.js"></script>
</body>
</html>
