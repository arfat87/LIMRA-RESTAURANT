<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIMRA Kitchen Display | Restaurant Management</title>
  <meta name="description" content="LIMRA Kitchen Display System — real-time order management for kitchen staff." />
  <link rel="stylesheet" href="../src/style.css" />
  <style>
    /* ── Kitchen-specific overrides ──────────────────────── */
    .kitchen-header {
      background: var(--dark-1);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 40;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .kitchen-header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .kitchen-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .kitchen-title-icon {
      font-size: 1.6rem;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.8rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: var(--r-full);
      font-size: 0.7rem;
      font-weight: 700;
      color: #ef4444;
      letter-spacing: 0.05em;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1.5s ease infinite;
    }

    #order-count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2rem;
      height: 2rem;
      padding: 0 0.6rem;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #000;
      border-radius: var(--r-full);
      font-size: 0.9rem;
      font-weight: 800;
      font-family: var(--font-display);
    }

    .order-count-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .kitchen-header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    #audio-toggle-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--dark-3);
      border: 1px solid var(--border-light);
      border-radius: var(--r-md);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--t-normal);
    }

    #audio-toggle-btn.audio-on {
      border-color: var(--gold-border);
      color: var(--gold);
      background: var(--gold-bg);
    }

    #audio-toggle-btn:hover {
      border-color: var(--gold-border);
      color: var(--gold);
    }

    .audio-icon {
      font-size: 1.1rem;
    }

    /* ── Kitchen Grid ───────────────────────────────────────── */
    #kitchen-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
      padding: 1.5rem;
    }

    @media (max-width: 900px) {
      #kitchen-grid { grid-template-columns: 1fr; }
    }

    /* ── Kitchen Card Enhancements ─────────────────────────── */
    .kitchen-card {
      background: var(--dark-2);
      border: 2px solid var(--border);
      border-radius: var(--r-xl);
      overflow: hidden;
      transition: all var(--t-normal);
      animation: fadeUp 0.4s ease both;
    }

    .kitchen-card.status-pending {
      border-color: var(--gold-border);
      box-shadow: 0 0 20px rgba(200, 134, 10, 0.12);
      animation: goldGlow 2s ease infinite;
    }

    .kitchen-card.status-accepted {
      border-color: rgba(234, 179, 8, 0.4);
    }

    .kitchen-card.status-preparing {
      border-color: rgba(249, 115, 22, 0.45);
      box-shadow: 0 0 16px rgba(249, 115, 22, 0.1);
    }

    .kitchen-card.status-ready {
      border-color: rgba(34, 197, 94, 0.45);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.1);
    }

    .kitchen-card.status-served {
      border-color: rgba(59, 130, 246, 0.35);
      opacity: 0.75;
    }

    .kitchen-card.status-urgent {
      border-color: rgba(239, 68, 68, 0.55) !important;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.15) !important;
    }

    .kitchen-card-header {
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--dark-3);
    }

    .kitchen-order-num {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: -0.5px;
    }

    .kitchen-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.2rem;
    }

    .kitchen-table-info {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .kitchen-area-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.15rem 0.5rem;
      border-radius: var(--r-full);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .area-indoor {
      background: rgba(139, 92, 246, 0.12);
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.25);
    }

    .area-outdoor {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .kitchen-header-right-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.25rem;
    }

    .kitchen-timer {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .kitchen-timer.urgent {
      color: #ef4444;
      animation: pulse 1.5s ease infinite;
    }

    .kitchen-status-chip {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.6rem;
      border-radius: var(--r-full);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    /* ── Items list ─────────────────────────────────────────── */
    .kitchen-items {
      padding: 0.75rem 1.25rem;
      max-height: 260px;
      overflow-y: auto;
    }

    .kitchen-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
      gap: 1rem;
    }

    .kitchen-item:last-child { border-bottom: none; }

    .kitchen-item-info { flex: 1; }

    .kitchen-item-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .kitchen-item-note {
      font-size: 0.78rem;
      color: var(--gold);
      margin-top: 0.2rem;
      font-style: italic;
      background: var(--gold-bg);
      border: 1px solid var(--gold-border);
      border-radius: var(--r-sm);
      padding: 0.15rem 0.5rem;
      display: inline-block;
    }

    .kitchen-item-qty {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--gold);
      flex-shrink: 0;
      background: var(--gold-bg);
      border: 1px solid var(--gold-border);
      width: 2.5rem;
      height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--r-md);
    }

    /* ── Special instructions block ─────────────────────────── */
    .kitchen-special-note {
      margin: 0 1.25rem 0.75rem;
      padding: 0.6rem 0.875rem;
      background: rgba(200, 134, 10, 0.08);
      border: 1px solid var(--gold-border);
      border-left: 3px solid var(--gold);
      border-radius: var(--r-md);
      font-size: 0.8rem;
      color: var(--gold);
      font-style: italic;
    }

    .kitchen-special-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gold-dark);
      display: block;
      margin-bottom: 0.2rem;
      font-style: normal;
    }

    /* ── Action buttons ─────────────────────────────────────── */
    .kitchen-actions {
      padding: 1rem 1.25rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      border-top: 1px solid var(--border);
      background: var(--dark-3);
    }

    .kitchen-btn {
      padding: 0.625rem 0.5rem;
      border-radius: var(--r-md);
      font-size: 0.78rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all var(--t-normal);
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }

    .kitchen-btn:active { transform: scale(0.96); }

    .btn-accept {
      background: rgba(234, 179, 8, 0.15);
      color: #eab308;
      border: 1px solid rgba(234, 179, 8, 0.4);
    }
    .btn-accept:hover { background: rgba(234, 179, 8, 0.25); }

    .btn-preparing {
      background: rgba(249, 115, 22, 0.15);
      color: #f97316;
      border: 1px solid rgba(249, 115, 22, 0.4);
    }
    .btn-preparing:hover { background: rgba(249, 115, 22, 0.25); }

    .btn-ready {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
    .btn-ready:hover { background: rgba(34, 197, 94, 0.25); }

    .btn-served {
      background: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }
    .btn-served:hover { background: rgba(59, 130, 246, 0.25); }

    .kitchen-btn.current-status {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Empty state ────────────────────────────────────────── */
    #kitchen-empty {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
    }

    .empty-chef-icon {
      font-size: 5rem;
      line-height: 1;
      animation: pulse 3s ease infinite;
    }

    .empty-title {
      font-family: var(--font-display);
      font-size: 1.75rem;
      color: var(--text-primary);
      font-weight: 700;
    }

    .empty-sub {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* ── Loading overlay ────────────────────────────────────── */
    #kitchen-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 1rem;
    }

    /* ── Hamburger btn on mobile ────────────────────────────── */
    #hamburger-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 2.25rem;
      height: 2.25rem;
      background: var(--dark-3);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--text-secondary);
      transition: all var(--t-fast);
      flex-shrink: 0;
    }

    #hamburger-btn:hover { border-color: var(--gold-border); color: var(--gold); }

    @media (max-width: 1024px) {
      #hamburger-btn { display: flex; }
    }

    /* ── Filter bar ─────────────────────────────────────────── */
    .kitchen-filter-bar {
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      background: var(--dark-2);
    }

    .filter-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-right: 0.25rem;
    }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.8rem;
      border-radius: var(--r-full);
      border: 1px solid var(--border);
      background: var(--dark-3);
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--t-fast);
    }

    .filter-chip:hover,
    .filter-chip.active {
      border-color: var(--gold-border);
      color: var(--gold);
      background: var(--gold-bg);
    }

    .filter-chip-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

    <!-- ── Main area ─────────────────────────────────────────────── -->
    <main class="admin-main">

      <!-- Header -->
      <header class="kitchen-header">
        <div class="kitchen-header-left">
          <button id="hamburger-btn" aria-label="Toggle menu">☰</button>
          <div class="kitchen-title">
            <span class="kitchen-title-icon">👨‍🍳</span>
            LIMRA Kitchen

            LIVE

            <span id="audio-label">Audio On</span>
          </button>
        </div>
      </header>

      <!-- Filter bar -->
      <div class="kitchen-filter-bar">
        <span class="filter-label">Filter:</span>
        <button class="filter-chip active" data-filter="all" id="filter-all">
          All Orders
        </button>
        <button class="filter-chip" data-filter="pending">
          <span class="filter-chip-dot" style="background:#c8860a;"></span>
          Pending
        </button>
        <button class="filter-chip" data-filter="accepted">
          <span class="filter-chip-dot" style="background:#eab308;"></span>
          Accepted
        </button>
        <button class="filter-chip" data-filter="preparing">
          <span class="filter-chip-dot" style="background:#f97316;"></span>
          Preparing
        </button>
        <button class="filter-chip" data-filter="ready">
          <span class="filter-chip-dot" style="background:#22c55e;"></span>
          Ready
        </button>
      </div>

      <!-- Loading state -->
      <div id="kitchen-loading">
        <div class="spinner spinner-lg"></div>
        <p style="color:var(--text-muted);font-size:0.9rem;">Loading orders…</p>
      </div>

      <!-- Empty state -->
      <div id="kitchen-empty">
        <div class="empty-chef-icon">👨‍🍳</div>
        <div class="empty-title">Kitchen is Clear!</div>
        <div class="empty-sub">No active orders — enjoy the calm before the storm.</div>
      </div>

      <!-- Order grid -->
      <div id="kitchen-grid" style="display:none;"></div>

    </main>
