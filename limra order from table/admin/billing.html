<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing — LIMRA RMS</title>
  <meta name="description" content="LIMRA Restaurant Management System — Billing & Payment Dashboard" />
  <link rel="stylesheet" href="../src/style.css" />
  <style>
    /* ── Billing-specific styles ── */
    .billing-grid {
      display: grid;
      gap: 1rem;
    }

    .billing-card {
      background: var(--dark-2);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      overflow: hidden;
      transition: all var(--t-normal);
    }
    .billing-card.bill-requested {
      border-color: rgba(239,68,68,0.5);
      animation: goldGlow 2s ease infinite;
    }
    .billing-card:hover { box-shadow: var(--shadow-md); }

    .billing-card-header {
      padding: 1rem 1.25rem;
      background: var(--dark-3);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .billing-meta { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .billing-order-num { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: var(--gold); }
    .billing-table-tag {
      background: var(--dark-2);
      border: 1px solid var(--border-light);
      border-radius: var(--r-full);
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .billing-card-body { padding: 1.25rem; }

    .billing-amounts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px,1fr));
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .amount-box {
      background: var(--dark-3);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 0.75rem;
      text-align: center;
    }
    .amount-box .label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 700; margin-bottom: 0.25rem; }
    .amount-box .value { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: var(--text-primary); }
    .amount-box.grand .value { color: var(--gold); font-size: 1.3rem; }

    .payment-methods {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .pay-method-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.875rem;
      border: 1px solid var(--border);
      border-radius: var(--r-full);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all var(--t-fast);
      user-select: none;
    }
    .pay-method-label:hover { border-color: var(--gold-border); color: var(--gold); }
    .pay-method-label input[type="radio"] { display: none; }
    .pay-method-label.selected { background: var(--gold-bg); border-color: var(--gold); color: var(--gold); font-weight: 700; }

    .billing-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .billing-items-list { margin-bottom: 1rem; }
    .billing-item-row {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-secondary);
      gap: 0.5rem;
    }
    .billing-item-row:last-child { border-bottom: none; }
    .billing-item-name { flex: 1; }
    .billing-item-qty  { color: var(--text-muted); width: 3rem; text-align: center; }
    .billing-item-price { color: var(--text-primary); font-weight: 600; text-align: right; }

    /* ── Invoice Modal ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      animation: fadeIn 0.2s ease both;
    }
    .modal-box {
      background: var(--dark-1);
      border: 1px solid var(--border-light);
      border-radius: var(--r-xl);
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      animation: fadeUp 0.3s ease both;
    }
    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-body { padding: 1.5rem; }
    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--r-sm);
      transition: color var(--t-fast);
    }
    .modal-close:hover { color: var(--text-primary); }

    /* ── Invoice print styles ── */
    #invoice-print-area {
      background: white;
      color: #111;
      padding: 2rem;
      border-radius: var(--r-lg);
      font-family: var(--font-body);
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    .empty-state .icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.5; }
    .empty-state h3 { font-size: 1.25rem; color: var(--text-secondary); margin-bottom: 0.5rem; }

    @media print {
      body * { visibility: hidden !important; }
      #invoice-print-area, #invoice-print-area * { visibility: visible !important; }
      #invoice-print-area {
        position: fixed;
        left: 0; top: 0;
        width: 100%;
        padding: 1rem;
        color: #111;
        background: white;
        font-size: 12px;
      }
    }

    .loading-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }

    .bill-requested-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: rgba(239,68,68,0.15);
      color: #ef4444;
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--r-full);
      padding: 0.2rem 0.6rem;
      font-size: 0.7rem;
      font-weight: 700;
      animation: pulse 1.5s ease infinite;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
<div class="admin-layout">

  <!-- Sidebar -->
  <aside id="admin-sidebar" class="admin-sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">🍽️</div>
      <div>
        <div class="sidebar-logo-text">LIMRA</div>
        <div class="sidebar-logo-sub">Restaurant MS</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-nav-section">Main</div>
      <a href="dashboard.html" class="sidebar-nav-link" data-page="dashboard.html">
        <svg class="sidebar-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>

      </a>
      <a href="orders.html" class="sidebar-nav-link" data-page="orders.html">

      </a>
      <a href="tables.html" class="sidebar-nav-link" data-page="tables.html">
        <svg class="sidebar-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
        Tables
      </a>
      <a href="kitchen.html" class="sidebar-nav-link" data-page="kitchen.html">
        <svg class="sidebar-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14v6m-3-3h6M6 10h.01M6 14h.01M6 18h.01M10 10h.01M10 14h.01M10 18h.01M14 10h.01M3 6l9-4 9 4v2H3V6z"/></svg>
        Kitchen

      <a href="billing.html" class="sidebar-nav-link" data-page="billing.html">
        <svg class="sidebar-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        Billing
      </a>
      <a href="reports.html" class="sidebar-nav-link" data-page="reports.html">
        <svg class="sidebar-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        Reports
      </a>
      <div class="sidebar-nav-section">Manage</div>
      <a href="menu.html" class="sidebar-nav-link" data-page="menu.html">

        Menu
      </a>
      <a href="settings.html" class="sidebar-nav-link" data-page="settings.html">
        <svg class="sidebar-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>

    <div style="padding:1rem 1.25rem; border-top:1px solid var(--border);">
      <button id="logout-btn" class="btn btn-outline btn-full btn-sm">🚪 Logout</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <!-- Topbar -->
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:1rem;">
        <button id="hamburger-btn" class="btn btn-outline btn-sm" aria-label="Toggle menu">☰</button>
        <div>
          <h1 style="font-family:var(--font-display);font-size:1.25rem;font-weight:700;color:var(--text-primary);">💳 Billing</h1>
          <p style="font-size:0.7rem;color:var(--text-muted);">Process payments & generate invoices</p>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:1rem;">
        <span id="live-clock" style="font-size:0.85rem;color:var(--text-muted);"></span>
        <div id="bill-request-alert" class="hidden">
          <span class="bill-requested-badge">🔔 Bill Requested!</span>
        </div>
      </div>
    </div>

    <div class="admin-content">
      <!-- Stats Row -->
      <div class="stats-row" id="billing-stats">
        <div class="stat-card gold">
          <div class="stat-icon">🧾</div>
          <div class="stat-value" id="stat-pending">0</div>
          <div class="stat-label">Pending Bills</div>
        </div>
        <div class="stat-card green">
          <div class="stat-icon">💰</div>
          <div class="stat-value" id="stat-today">₹0</div>
          <div class="stat-label">Today's Collection</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-icon">🏷️</div>
          <div class="stat-value" id="stat-gst">₹0</div>
          <div class="stat-label">GST Collected</div>
        </div>
        <div class="stat-card red">
          <div class="stat-icon">🔔</div>
          <div class="stat-value" id="stat-bill-req">0</div>
          <div class="stat-label">Bill Requested</div>
        </div>
      </div>

      <!-- Bills Grid -->
      <div id="billing-list" class="billing-grid">
        <div class="loading-state">
          <div class="spinner spinner-lg" style="margin:0 auto 1rem;"></div>
          <p>Loading pending bills…</p>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Invoice Modal -->
<div id="invoice-modal" class="modal-backdrop hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h3 style="font-family:var(--font-display);font-size:1.1rem;color:var(--text-primary);">🧾 Invoice</h3>
      <button class="modal-close" onclick="document.getElementById('invoice-modal').classList.add('hidden')">&times;</button>
    </div>
    <div class="modal-body">
      <div id="invoice-print-area"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-gold" onclick="window.print()">🖨️ Print</button>
      <button class="btn btn-outline" id="whatsapp-btn">📱 WhatsApp</button>
      <button class="btn btn-outline" onclick="document.getElementById('invoice-modal').classList.add('hidden')">Close</button>
    </div>
  </div>
</div>

<script type="module" src="./billing.js"></script>
</body>
</html>
